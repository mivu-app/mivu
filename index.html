<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIVU</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #171717;
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      min-height: 150px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .card p {
      color: #777;
    }

    .active {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      color: #555;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #35c759;
      border-radius: 50%;
    }

    nav {
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      position: sticky;
      bottom: 0;
    }

    nav button {
      border: none;
      background: none;
      font-size: 14px;
      color: #666;
      cursor: pointer;
    }

    nav button:first-child {
      color: #111;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">MIVU</div>
      <div class="profile">👤</div>
    </header>

    <main>

      <div class="welcome">
        <h1>Welcome to MIVU 👋</h1>
        <p>Your place to chat, connect and hang out.</p>
      </div>

      <div class="cards">

        <div class="card">
          <h2>💬 Chats</h2>
          <p>Talk with your friends and groups.</p>
          <div class="active">
            <span class="dot"></span>
            Active
          </div>
        </div>

        <div class="card">
          <h2>🏠 Servers</h2>
          <p>Join communities and discover new people.</p>
        </div>

        <div class="card">
          <h2>👥 Friends</h2>
          <p>See your friends and who's online.</p>
        </div>

        <div class="card">
          <h2>👤 Profile</h2>
          <p>Customize your MIVU profile.</p>
        </div>

      </div>

    </main>

    <nav>
      <button>🏠 Home</button>
      <button>💬 Chats</button>
      <button>🏠 Servers</button>
      <button>👥 Friends</button>
      <button>👤 Profile</button>
    </nav>

  </div>

</body>
</html>
